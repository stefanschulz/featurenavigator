name: PHP Tests
on: [push, pull_request]
jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring,intl,zip
      - run: cd featurenavigator && composer install --prefer-dist --no-progress
      - run: cd featurenavigator && vendor/bin/phpunit   # reads phpunit.xml.dist automatically
